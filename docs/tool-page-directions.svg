<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="650" viewBox="0 0 1020 650">
<defs>
 <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#55d8bf"/><stop offset=".5" stop-color="#bc8cf2"/><stop offset="1" stop-color="#e9b870"/></linearGradient>
 <linearGradient id="well" x2=".7" y2="1"><stop stop-color="#111319"/><stop offset="1" stop-color="#20232c"/></linearGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
 <filter id="inset"><feGaussianBlur stdDeviation="2"/></filter>
 <style>text{font-family:Inter,Arial,sans-serif;fill:#eff0f4} .muted{fill:#a2a8b9;font-size:12px} .label{fill:#aeb4c4;font-size:11px;letter-spacing:1px} .sample{font-size:23px} .row{fill:url(#well);stroke:#363b48;stroke-width:1}</style>
</defs>
<rect width="1020" height="650" rx="20" fill="#101117"/>
<text x="30" y="36" font-size="20" font-weight="600">Keywi · tool page directions</text>
<text x="30" y="60" class="muted">Same content, three ways to give it hierarchy. Concept sketches; fonts are illustrative.</text>
<g transform="translate(30 86)">
 <rect width="300" height="490" rx="22" fill="#252833"/>
 <text x="18" y="34" font-size="17" font-weight="600">01  Recessed console</text>
 <text x="18" y="56" class="muted">Shallow wells · continuous rim light</text>
 <rect x="16" y="78" width="268" height="44" rx="12" fill="#15171e"/>
 <text x="30" y="105" font-size="14" font-weight="600">Formatting</text><text x="246" y="105" fill="#b5da73">◉</text>
 <text x="18" y="148" class="label">CASE   /   SCRIPTS   /   TYPE</text>
 <rect x="16" y="164" width="130" height="106" rx="14" fill="url(#well)" stroke="url(#edge)"/>
 <rect x="154" y="164" width="130" height="106" rx="14" fill="url(#well)" stroke="url(#edge)"/>
 <rect x="16" y="280" width="130" height="106" rx="14" fill="url(#well)" stroke="url(#edge)"/>
 <rect x="154" y="280" width="130" height="106" rx="14" fill="url(#well)" stroke="url(#edge)"/>
 <path d="M30 168 H132 M168 168 H270 M30 284 H132 M168 284 H270" stroke="#08090e" stroke-width="5" opacity=".8" filter="url(#inset)"/>
 <text x="28" y="193" class="label">UPPERCASE</text><text x="28" y="231" class="sample">KEYWI</text>
 <text x="166" y="193" class="label">lowercase</text><text x="166" y="231" class="sample">keywi</text>
 <text x="28" y="309" class="label">BOLD</text><text x="28" y="347" class="sample" font-weight="700">Keywi</text>
 <text x="166" y="309" class="label">ITALIC</text><text x="166" y="347" class="sample" font-style="italic">Keywi</text>
 <rect x="8" y="64" width="284" height="344" rx="18" filter="url(#grain)" opacity=".035"/>
 <text x="18" y="434" class="muted">Closest to your dark-neumorphism idea.</text>
 <text x="18" y="455" class="muted">Keep shadows short and labels crisp.</text>
</g>
<g transform="translate(360 86)">
 <rect width="300" height="490" rx="22" fill="#1b1e27"/>
 <text x="18" y="34" font-size="17" font-weight="600">02  Quiet selection</text>
 <text x="18" y="56" class="muted">Neutral wells · light only where active</text>
 <rect x="16" y="78" width="268" height="44" rx="12" fill="#11141b"/>
 <text x="30" y="105" font-size="14" font-weight="600">Formatting</text><text x="246" y="105">◉</text>
 <rect x="16" y="136" width="60" height="28" rx="8" fill="#3a334c"/>
 <text x="30" y="155" font-size="12">Case</text><text x="94" y="155" class="muted">Scripts</text><text x="171" y="155" class="muted">Typography</text>
 <rect x="16" y="180" width="130" height="100" rx="12" fill="url(#well)" stroke="url(#edge)" stroke-width="1.5"/>
 <rect x="154" y="180" width="130" height="100" rx="12" class="row"/>
 <rect x="16" y="290" width="130" height="100" rx="12" class="row"/>
 <rect x="154" y="290" width="130" height="100" rx="12" class="row"/>
 <text x="28" y="209" class="label">UPPERCASE</text><text x="28" y="249" class="sample">KEYWI</text>
 <text x="166" y="209" class="label">lowercase</text><text x="166" y="249" class="sample">keywi</text>
 <text x="28" y="319" class="label">TITLE CASE</text><text x="28" y="359" class="sample">Keywi</text>
 <text x="166" y="319" class="label">ALTERNATING</text><text x="166" y="359" class="sample">kEyWi</text>
 <text x="18" y="434" class="muted">Least visual competition with artwork.</text>
 <text x="18" y="455" class="muted">Let selection carry the bright accent.</text>
</g>
<g transform="translate(690 86)">
 <rect width="300" height="490" rx="22" fill="#171c25"/>
 <text x="18" y="34" font-size="17" font-weight="600">03  Type specimen list</text>
 <text x="18" y="56" class="muted">One-column rows · label and sample</text>
 <text x="18" y="106" font-size="25" font-weight="600">Formatting</text>
 <text x="18" y="136" class="muted">CASE     SCRIPTS     TYPOGRAPHY</text>
 <path d="M18 150 H282" stroke="url(#edge)"/>
 <g>
  <rect x="16" y="167" width="268" height="52" rx="10" class="row"/>
  <rect x="16" y="227" width="268" height="52" rx="10" class="row"/>
  <rect x="16" y="287" width="268" height="52" rx="10" class="row"/>
  <rect x="16" y="347" width="268" height="52" rx="10" class="row"/>
  <text x="30" y="199" class="muted">Uppercase</text><text x="163" y="201" class="sample">KEYWI</text>
  <text x="30" y="259" class="muted">Lowercase</text><text x="163" y="261" class="sample">keywi</text>
  <text x="30" y="319" class="muted">Bold</text><text x="163" y="321" class="sample" font-weight="700">Keywi</text>
  <text x="30" y="379" class="muted">Italic</text><text x="163" y="381" class="sample" font-style="italic">Keywi</text>
 </g>
 <text x="18" y="434" class="muted">The clearest typographic hierarchy.</text>
 <text x="18" y="455" class="muted">Can switch to a grid for kaomoji.</text>
</g>
<text x="30" y="617" class="muted">Grain stays on surfaces, not glyphs. Keep theme artwork behind a calm scrim; avoid blurring labels.</text>
</svg>