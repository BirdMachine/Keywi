name: Settings guide screenshots

on:
  workflow_dispatch:
  push:
    branches: [docs/settings-guide]
    paths:
      - .github/workflows/settings-guide.yml
      - scripts/capture-settings-guide.py

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build disposable documentation APK
        run: |
          ./gradlew assembleDebug
          ./gradlew --stop
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 2048M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/capture-settings-guide.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: settings-guide-captures
          path: settings-guide-captures/
          retention-days: 14
