name: Settings guide screenshots

on:
  workflow_dispatch:
    inputs:
      include_theme_previews:
        description: 'Also attempt theme preview pages (known emulator disconnect)'
        type: boolean
        default: false
  push:
    branches: [docs/settings-guide]
    paths:
      - .github/workflows/settings-guide.yml
      - scripts/capture-settings-guide.py

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Android emulator build
        uses: ./.github/actions/setup-android-emulator
      - name: Build disposable documentation APK
        run: |
          ./gradlew assembleDebug
          ./gradlew --stop
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 2048M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/capture-settings-guide.py ${{ inputs.include_theme_previews && '--include-theme-previews' || '' }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: settings-guide-captures
          path: settings-guide-captures/
          retention-days: 14
