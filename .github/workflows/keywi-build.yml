name: Keywi CI

on:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:
    branches:
      - "main"

concurrency:
  group: keywi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate & build Keywi APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYWI_DEBUG_STORE_FILE: ${{ github.workspace }}/.github/keywi-debug.keystore
      KEYWI_DEBUG_STORE_PASSWORD: keywi-debug
      KEYWI_DEBUG_KEY_ALIAS: keywi-debug
      KEYWI_DEBUG_KEY_PASSWORD: keywi-debug

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore stable Keywi debug signing key
        run: |
          base64 --decode .github/keywi-debug.keystore.b64 > .github/keywi-debug.keystore
          chmod 600 .github/keywi-debug.keystore

      - name: Set monotonic Keywi version code
        run: echo "KEYWI_VERSION_CODE=$((300000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Normalize Kotlin formatting
        run: ./gradlew formatKotlin

      - name: Check Kotlin formatting
        run: ./gradlew lintKotlin

      - name: Test custom board behavior
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lint

      - name: Build Keywi debug APK
        run: ./gradlew assembleDebug

      - name: Stage APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Keywi-latest.apk

      - name: Build release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="keywi-build-${GITHUB_RUN_NUMBER}"
          NOTES_FILE="release/RELEASE_NOTES.md"
          PREVIOUS_TAG="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --json tagName,isDraft \
              --jq '[.[] | select(.isDraft == false) | .tagName | select(startswith("keywi-build-"))][0] // ""'
          )"

          if [[ -n "$PREVIOUS_TAG" ]] && git rev-parse --verify "${PREVIOUS_TAG}^{commit}" >/dev/null 2>&1; then
            RANGE="${PREVIOUS_TAG}..${GITHUB_SHA}"
          else
            RANGE="${GITHUB_SHA}^..${GITHUB_SHA}"
          fi

          {
            echo "# 🥝 Keywi build ${GITHUB_RUN_NUMBER}"
            echo
            echo "Fresh signed Keywi APK from \`main\`, ready for an in-place update over compatible Keywi builds."
            echo
            echo "## ✨ Changes in this build"
            echo

            CHANGE_COUNT="$(git rev-list --count "$RANGE")"
            if [[ "$CHANGE_COUNT" -gt 0 ]]; then
              git log "$RANGE" \
                --first-parent \
                --pretty=format:'- %s ([`%h`](https://github.com/'"$GITHUB_REPOSITORY"'/commit/%H))'
              echo
            else
              echo "- No user-visible source changes were detected since the previous Keywi release."
            fi

            echo
            echo "## 📦 Install / update"
            echo
            echo "- Download **Keywi-latest.apk** from the Assets section below."
            echo "- It is signed with Keywi's stable update key, so compatible existing installs can update in place."
            echo "- Android version code for this build: \`$((300000 + GITHUB_RUN_NUMBER))\`."
            echo "- Built from commit [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "## 🔎 Full changelog"
            echo

            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "[Compare ${PREVIOUS_TAG} → ${TAG}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_SHA})"
            else
              echo "This is the first release found by the automated changelog generator."
            fi
          } > "$NOTES_FILE"

          cat "$NOTES_FILE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: keywi-debug
          path: release/Keywi-latest.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="keywi-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/Keywi-latest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Keywi build ${GITHUB_RUN_NUMBER}" \
            --notes-file release/RELEASE_NOTES.md

      - name: Verify GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="keywi-build-${GITHUB_RUN_NUMBER}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url >/tmp/keywi-release.json
          test "$(jq -r '.tagName' /tmp/keywi-release.json)" = "$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Keywi-latest.apk'
          echo "Verified $TAG and Keywi-latest.apk"
