name: Keywi Emulator Showcase

on:
  workflow_dispatch:
  push:
    branches:
      - feature/emulator-showcase-capture
      - feature/shadertoy-renderer-layers
    paths:
      - .github/workflows/emulator-showcase.yml
      - scripts/capture-keywi-showcase.py
      - scripts/capture-keywi-shaders.py
      - scripts/run-keywi-emulator.sh
      - app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/shader/**
      - app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/KeyboardBackdrop.kt
      - app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/MachineCutSkeleton.kt

concurrency:
  group: keywi-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build signed emulator APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEYWI_DEBUG_STORE_FILE: ${{ github.workspace }}/.github/keywi-debug.keystore
      KEYWI_DEBUG_STORE_PASSWORD: keywi-debug
      KEYWI_DEBUG_KEY_ALIAS: keywi-debug
      KEYWI_DEBUG_KEY_PASSWORD: keywi-debug
    steps:
      - uses: actions/checkout@v6
      - name: Restore stable signing key
        run: |
          base64 --decode .github/keywi-debug.keystore.b64 > .github/keywi-debug.keystore
          chmod 600 .github/keywi-debug.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Keywi
        run: ./gradlew assembleDebug
      - name: Transfer APK to clean emulator runner
        uses: actions/upload-artifact@v6
        with:
          name: keywi-emulator-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  capture:
    name: Capture actual Keywi keyboard
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Retrieve prebuilt APK
        uses: actions/download-artifact@v6
        with:
          name: keywi-emulator-apk
          path: app/build/outputs/apk/debug/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect clean-runner memory
        run: |
          free -h
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture real keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swangle -memory 2048 -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-keywi-emulator.sh
      - name: Upload captures and verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: keywi-emulator-showcase
          path: showcase/
          if-no-files-found: warn
          retention-days: 14
