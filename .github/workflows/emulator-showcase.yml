name: Keywi Emulator Showcase

on:
  push:
    branches: [main]
    paths:
      - app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/**
      - scripts/capture-keywi-showcase.py
      - .github/workflows/emulator-showcase.yml
      - .github/actions/setup-android-emulator/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture actual Keywi keyboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYWI_DEBUG_STORE_FILE: ${{ github.workspace }}/.github/keywi-debug.keystore
      KEYWI_DEBUG_STORE_PASSWORD: keywi-debug
      KEYWI_DEBUG_KEY_ALIAS: keywi-debug
      KEYWI_DEBUG_KEY_PASSWORD: keywi-debug
    steps:
      - uses: actions/checkout@v6
      - name: Restore stable signing key
        run: |
          base64 --decode .github/keywi-debug.keystore.b64 > .github/keywi-debug.keystore
          chmod 600 .github/keywi-debug.keystore
      - name: Prepare Android emulator build
        uses: ./.github/actions/setup-android-emulator
      - name: Build Keywi
        run: ./gradlew assembleDebug
      - name: Capture real keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/capture-keywi-showcase.py
      - name: Upload captures and verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: keywi-emulator-showcase
          path: showcase/
          if-no-files-found: warn
          retention-days: 14
